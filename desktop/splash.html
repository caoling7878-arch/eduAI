<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>eduAI 正在启动</title>
    <style>
      :root {
        --bg0: #0b3d36;
        --bg1: #0f6b5c;
        --ink: #f4faf8;
        --muted: rgba(244, 250, 248, 0.72);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(120, 220, 190, 0.28), transparent 55%),
          linear-gradient(145deg, var(--bg0), var(--bg1) 55%, #145a4f);
      }
      .wrap {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 32px;
        text-align: center;
      }
      .mark {
        width: 88px;
        height: 88px;
        margin: 0 auto 20px;
        border-radius: 22px;
        background:
          linear-gradient(160deg, rgba(255,255,255,0.22), transparent 50%),
          linear-gradient(145deg, #1aa388, #0d5c50);
        display: grid;
        place-items: center;
        font-size: 48px;
        font-weight: 700;
        letter-spacing: -0.04em;
        box-shadow: 0 18px 40px rgba(0,0,0,0.22);
        animation: float 2.4s ease-in-out infinite;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }
      .ver {
        margin: 6px 0 10px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: rgba(244, 250, 248, 0.92);
      }
      .bar {
        width: min(280px, 70vw);
        height: 4px;
        margin: 28px auto 0;
        border-radius: 999px;
        background: rgba(255,255,255,0.14);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: inherit;
        background: rgba(255,255,255,0.85);
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <div class="mark" aria-hidden="true">e</div>
        <h1>eduAI</h1>
        <p id="app-ver" class="ver"></p>
        <p>正在启动本地服务，请稍候…</p>
        <div class="bar"><i></i></div>
      </div>
    </div>
  </body>
</html>
